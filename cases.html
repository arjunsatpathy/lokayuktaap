<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cases | Arunachal Pradesh Lokayukta</title>
    <meta name="description" content="Public case information of Arunachal Pradesh Lokayukta.">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="https://lokayukta.arunachal.gov.in/images/favicon.ico" type="image/x-icon">
    <script src="components/navbar.js"></script>
    <script src="components/footer.js"></script>
    <script src="app.js" defer></script>
</head>
<body>
    <div id="navbar-container"></div>
    <div class="spacer"></div>

    <div class="page-header">
        <h1>Cases</h1>
        <p>Public case information and orders</p>
        <div class="breadcrumb">
            <a href="index.html">Home</a> <span>/</span> <span>Public Information</span> <span>/</span> <span>Cases</span>
        </div>
    </div>

    <div class="container">
        <div class="content-section fade-in">
            <div class="section-label">Public Information</div>
            <h2 class="section-title">Case Records</h2>
            <div class="section-divider"></div>

            <div class="table-wrapper" style="margin-top: 1.5rem;">
                <table class="modern-table">
                    <thead>
                        <tr>
                            <th scope="col" style="width: 100px;">Sl. No.</th>
                            <th scope="col">Case No.</th>
                            <th scope="col" style="width: 160px; text-align: center;">View Order</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td style="font-weight: 600;">1</td>
                            <td style="font-weight: 500;">
                                <div style="display: flex; align-items: center; gap: 0.75rem;">
                                    <img src="icons/cases.svg" style="width: 20px; height: 20px;" alt="" aria-hidden="true">
                                    <span>Case No. 01/2021</span>
                                </div>
                            </td>
                            <td style="text-align: center;">
                                <a href="pdf/cases/01.pdf" target="_blank" class="download-link" aria-label="View Order for Case No. 01/2021 (opens in new tab)">View Order</a>
                            </td>
                        </tr>
                        <tr>
                            <td style="font-weight: 600;">2</td>
                            <td style="font-weight: 500;">
                                <div style="display: flex; align-items: center; gap: 0.75rem;">
                                    <img src="icons/cases.svg" style="width: 20px; height: 20px;" alt="" aria-hidden="true">
                                    <span>Case No. 01/2026</span>
                                </div>
                            </td>
                            <td style="text-align: center;">
                                <a href="pdf/cases/02.pdf" target="_blank" class="download-link" aria-label="View Order for Case No. 01/2026 (opens in new tab)">View Order</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="footer-container"></div>
</body>
</html>
